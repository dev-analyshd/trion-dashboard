services:
  # Backend API Service
  - type: web
    name: trion-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -u main.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5001
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health

  # Frontend Dashboard Service
  - type: web
    name: trion-dashboard
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          name: trion-backend
          type: web
          property: hostport
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          name: trion-backend
          type: web
          property: hostport
          transform: ws://{value}
    healthCheckPath: /api/trion/health
